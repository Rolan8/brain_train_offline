<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c8cff"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowN" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgN)"/>

  <!-- ===== Нейронная сеть (за буквой) ===== -->
  <g stroke="#ffffff" stroke-width="1" stroke-linecap="round">

    <!-- Внешний контур: 12 узлов -->
    <!-- Верхний ряд -->
    <line x1="22"  y1="20" x2="52"  y2="12" opacity="0.55"/>
    <line x1="52"  y1="12" x2="82"  y2="12" opacity="0.55"/>
    <line x1="82"  y1="12" x2="108" y2="22" opacity="0.55"/>

    <!-- Правый бок -->
    <line x1="108" y1="22" x2="118" y2="52" opacity="0.55"/>
    <line x1="118" y1="52" x2="118" y2="80" opacity="0.55"/>
    <line x1="118" y1="80" x2="108" y2="108" opacity="0.55"/>

    <!-- Нижний ряд -->
    <line x1="108" y1="108" x2="80"  y2="118" opacity="0.55"/>
    <line x1="80"  y1="118" x2="48"  y2="118" opacity="0.55"/>
    <line x1="48"  y1="118" x2="20"  y2="108" opacity="0.55"/>

    <!-- Левый бок -->
    <line x1="20"  y1="108" x2="10"  y2="80" opacity="0.55"/>
    <line x1="10"  y1="80"  x2="10"  y2="52" opacity="0.55"/>
    <line x1="10"  y1="52"  x2="22"  y2="20" opacity="0.55"/>

    <!-- Диагонали внутрь, слабые -->
    <line x1="22"  y1="20"  x2="118" y2="80"  opacity="0.15"/>
    <line x1="108" y1="22"  x2="10"  y2="80"  opacity="0.15"/>
    <line x1="20"  y1="108" x2="118" y2="52"  opacity="0.15"/>
    <line x1="108" y1="108" x2="10"  y2="52"  opacity="0.15"/>
    <line x1="22"  y1="20"  x2="108" y2="108" opacity="0.12"/>
    <line x1="108" y1="22"  x2="20"  y2="108" opacity="0.12"/>

    <!-- Внутренние связи между средними узлами -->
    <line x1="52"  y1="12"  x2="40"  y2="40"  opacity="0.35"/>
    <line x1="82"  y1="12"  x2="94"  y2="40"  opacity="0.35"/>
    <line x1="118" y1="52"  x2="92"  y2="56"  opacity="0.35"/>
    <line x1="118" y1="80"  x2="92"  y2="82"  opacity="0.35"/>
    <line x1="80"  y1="118" x2="88"  y2="94"  opacity="0.35"/>
    <line x1="48"  y1="118" x2="42"  y2="94"  opacity="0.35"/>
    <line x1="10"  y1="80"  x2="34"  y2="86"  opacity="0.35"/>
    <line x1="10"  y1="52"  x2="36"  y2="48"  opacity="0.35"/>
  </g>

  <!-- ===== Узлы-нейроны ===== -->

  <!-- 12 крупных по периметру -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="22"  cy="20"  r="2.8"/>
    <circle cx="52"  cy="12"  r="2.8"/>
    <circle cx="82"  cy="12"  r="2.8"/>
    <circle cx="108" cy="22"  r="2.8"/>
    <circle cx="118" cy="52"  r="2.8"/>
    <circle cx="118" cy="80"  r="2.8"/>
    <circle cx="108" cy="108" r="2.8"/>
    <circle cx="80"  cy="118" r="2.8"/>
    <circle cx="48"  cy="118" r="2.8"/>
    <circle cx="20"  cy="108" r="2.8"/>
    <circle cx="10"  cy="80"  r="2.8"/>
    <circle cx="10"  cy="52"  r="2.8"/>
  </g>

  <!-- 8 средних внутри (на связях) -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="40"  cy="40"  r="1.9"/>
    <circle cx="94"  cy="40"  r="1.9"/>
    <circle cx="92"  cy="56"  r="1.9"/>
    <circle cx="92"  cy="82"  r="1.9"/>
    <circle cx="88"  cy="94"  r="1.9"/>
    <circle cx="42"  cy="94"  r="1.9"/>
    <circle cx="34"  cy="86"  r="1.9"/>
    <circle cx="36"  cy="48"  r="1.9"/>
  </g>

  <!-- Мелкие узлы-синапсы для плотности -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="36"  cy="16"  r="1.2"/>
    <circle cx="68"  cy="16"  r="1.2"/>
    <circle cx="96"  cy="28"  r="1.2"/>
    <circle cx="114" cy="66"  r="1.2"/>
    <circle cx="96"  cy="100" r="1.2"/>
    <circle cx="64"  cy="112" r="1.2"/>
    <circle cx="32"  cy="100" r="1.2"/>
    <circle cx="16"  cy="66"  r="1.2"/>
  </g>

  <!-- Мягкое свечение под буквой -->
  <circle cx="64" cy="64" r="46" fill="url(#glowN)"/>

  <!-- ===== Буква K ===== -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M44 30 V98"/>
    <path d="M44 64 L82 30"/>
    <path d="M44 64 L74 98"/>
  </g>
</svg>