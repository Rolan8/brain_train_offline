    <g stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.55">
      <line x1="12" y1="10" x2="32" y2="6"/>
      <line x1="32" y1="6"  x2="52" y2="10"/>
      <line x1="52" y1="10" x2="58" y2="28"/>
      <line x1="58" y1="28" x2="58" y2="44"/>
      <line x1="58" y1="44" x2="52" y2="56"/>
      <line x1="52" y1="56" x2="32" y2="60"/>
      <line x1="32" y1="60" x2="12" y2="56"/>
      <line x1="12" y1="56" x2="6"  y2="44"/>
      <line x1="6"  y1="44" x2="6"  y2="28"/>
